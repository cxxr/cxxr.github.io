<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3fa9f5"/>
      <stop offset="65%" stop-color="#80d0ff"/>
      <stop offset="100%" stop-color="#c4ecff"/>
    </linearGradient>

    <!-- Dirt ground gradient -->
    <linearGradient id="dirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c08447"/>
      <stop offset="100%" stop-color="#7a4b22"/>
    </linearGradient>

    <!-- Ramp gradient -->
    <linearGradient id="rampGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d09252"/>
      <stop offset="100%" stop-color="#8a5527"/>
    </linearGradient>

    <!-- Frame red gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="100%" stop-color="#d50000"/>
    </linearGradient>

    <!-- Gold star/badge gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
  </defs>

  <!-- App icon base with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Sun -->
  <circle cx="410" cy="100" r="44" fill="#ffe066" opacity="0.9"/>
  <circle cx="410" cy="100" r="60" fill="#fff" opacity="0.2"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="110" cy="130" rx="45" ry="24"/>
    <circle cx="135" cy="118" r="28"/>
    <circle cx="90" cy="122" r="22"/>
  </g>

  <!-- Green rolling hill in back -->
  <path d="M 0 380 Q 200 320 512 360 L 512 512 L 0 512 Z" fill="#6cc06c"/>

  <!-- Dirt ground -->
  <path d="M 0 410 L 512 410 L 512 512 L 0 512 Z" fill="url(#dirtGrad)"/>
  <rect x="0" y="410" width="512" height="8" fill="#d9a066"/>

  <!-- Dirt jump ramp -->
  <path d="M 40 410 Q 150 410 180 330 L 220 410 Z" fill="url(#rampGrad)" stroke="#ecb77c" stroke-width="4"/>
  <!-- Ramp lip flag -->
  <line x1="180" y1="330" x2="180" y2="295" stroke="#333" stroke-width="3"/>
  <polygon points="180,295 208,303 180,312" fill="#ff3b3b"/>

  <!-- Floating Math Symbols (Playful & Energetic) -->
  <!-- Plus (+) -->
  <g transform="translate(90, 210) rotate(-12)" fill="#ffd600" stroke="#222" stroke-width="3">
    <rect x="-6" y="-22" width="12" height="44" rx="4"/>
    <rect x="-22" y="-6" width="44" height="12" rx="4"/>
  </g>
  <!-- Multiplication (x) -->
  <g transform="translate(425, 230) rotate(22)" fill="#00e676" stroke="#222" stroke-width="3">
    <rect x="-6" y="-20" width="12" height="40" rx="4"/>
    <rect x="-20" y="-6" width="40" height="12" rx="4"/>
  </g>
  <!-- Minus (-) -->
  <g transform="translate(140, 90) rotate(15)" fill="#ff4081" stroke="#222" stroke-width="3">
    <rect x="-18" y="-6" width="36" height="12" rx="4"/>
  </g>
  <!-- Division / Star (⭐) -->
  <g transform="translate(370, 310)">
    <polygon points="0,-16 4,-4 16,-4 7,4 10,16 0,8 -10,16 -7,4 -16,-4 -4,-4" fill="url(#goldGrad)" stroke="#222" stroke-width="2.5"/>
  </g>

  <!-- BMX Bike & Rider in Air (Centerpiece) -->
  <g transform="translate(290, 240) scale(1.65)">
    <!-- Shadow underneath -->
    <ellipse cx="0" cy="95" rx="40" ry="6" fill="#000" opacity="0.25"/>

    <!-- Air trails / speed bursts -->
    <path d="M -50 -10 Q -65 -15 -75 -12" stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M -45 10 Q -60 12 -70 8" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- Rear Wheel -->
    <g transform="translate(-32, 10)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#222" stroke-width="5"/>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#cfcfcf" stroke-width="1.8"/>
      <!-- Spokes -->
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#bbb" stroke-width="1.5"/>
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#bbb" stroke-width="1.5"/>
      <line x1="-10" y1="-10" x2="10" y2="10" stroke="#bbb" stroke-width="1.5"/>
      <line x1="-10" y1="10" x2="10" y2="-10" stroke="#bbb" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3.5" fill="#555"/>
    </g>

    <!-- Front Wheel -->
    <g transform="translate(32, 10)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#222" stroke-width="5"/>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#cfcfcf" stroke-width="1.8"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#bbb" stroke-width="1.5"/>
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#bbb" stroke-width="1.5"/>
      <line x1="-10" y1="-10" x2="10" y2="10" stroke="#bbb" stroke-width="1.5"/>
      <line x1="-10" y1="10" x2="10" y2="-10" stroke="#bbb" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3.5" fill="#555"/>
    </g>

    <!-- Bike Frame (Chunky BMX diamond geometry) -->
    <!-- Chainstay & bottom bracket -->
    <line x1="-32" y1="10" x2="-2" y2="11" stroke="url(#frameGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Seatstay -->
    <line x1="-32" y1="10" x2="-14" y2="-16" stroke="url(#frameGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Seat tube -->
    <line x1="-2" y1="11" x2="-14" y2="-16" stroke="url(#frameGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Down tube -->
    <line x1="-2" y1="11" x2="20" y2="-10" stroke="url(#frameGrad)" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Top tube -->
    <line x1="-14" y1="-16" x2="20" y2="-10" stroke="url(#frameGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Fork -->
    <line x1="20" y1="-10" x2="32" y2="10" stroke="#e0e0e0" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Cranks & Pedals -->
    <circle cx="-2" cy="11" r="5" fill="#333"/>
    <line x1="-2" y1="11" x2="5" y2="19" stroke="#777" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="2" y1="19" x2="8" y2="19" stroke="#222" stroke-width="4" stroke-linecap="round"/>
    <!-- Seat -->
    <path d="M -22 -19 Q -13 -21 -6 -19 L -13 -14 Z" fill="#222"/>

    <!-- Stem & Handlebars -->
    <line x1="18" y1="-10" x2="14" y2="-26" stroke="#333" stroke-width="4" stroke-linecap="round"/>
    <line x1="8" y1="-26" x2="21" y2="-28" stroke="#222" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Number Plate "7" -->
    <rect x="18" y="-26" width="13" height="12" rx="2.5" fill="#ffffff" stroke="#222" stroke-width="1.8"/>
    <text x="24.5" y="-17" font-family="'Arial Black', Fredoka, sans-serif" font-weight="900" font-size="9" fill="#d50000" text-anchor="middle">7</text>

    <!-- Rider: Legs -->
    <!-- Far leg -->
    <path d="M -11 -32 L -1 -8 L 5 18" stroke="#1c2d42" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="6" cy="18" r="3.5" fill="#111"/>

    <!-- Torso -->
    <line x1="-10" y1="-32" x2="8" y2="-52" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round"/>
    <line x1="-10" y1="-32" x2="-6" y2="-36" stroke="#263a5a" stroke-width="12" stroke-linecap="round"/>

    <!-- Near leg -->
    <path d="M -10 -32 L 2 -12 L 6 18" stroke="#263a5a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="7" cy="18" r="4" fill="#111"/>

    <!-- Head & Helmet -->
    <circle cx="15" cy="-63" r="9.5" fill="#f5c99b"/>
    <!-- Helmet -->
    <path d="M 5 -64 A 12 12 0 0 1 27 -63 Z" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
    <rect x="12" y="-74" width="4.5" height="11" fill="#d50000"/>
    <!-- Visor -->
    <line x1="18" y1="-67" x2="30" y2="-65" stroke="#222" stroke-width="3" stroke-linecap="round"/>
    <!-- Eye & Smile -->
    <circle cx="21" cy="-62" r="1.4" fill="#222"/>
    <path d="M 19 -58 Q 23 -56 25 -58" stroke="#222" stroke-width="1.4" fill="none"/>

    <!-- Arm reaching to Handlebars -->
    <path d="M 8 -50 L 16 -38 L 16 -26" stroke="url(#frameGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="16" cy="-26" r="3.5" fill="#f5c99b"/>
  </g>
</svg>
